[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rotml"
version = "0.1.0"
description = "Machine learning for molecular structure determination from rotational and rovibrational spectra"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "rdkit>=2024.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
xtb = ["tblite>=0.4", "ase>=3.23"]
ml = ["torch>=2.2", "selfies>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
